name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Keyless checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra ui --extra docs
      - name: Notebooks valid, shared cells identical, no secrets, code compiles
        run: uv run python scripts/check_notebooks.py
      - name: Docs site builds with no broken links
        run: uv run mkdocs build --strict
      - name: Scripts compile
        run: uv run python -m py_compile app.py jobs/email_triage.py scripts/doctor.py scripts/check_notebooks.py

  execute:
    name: Execute notebooks (needs OPENROUTER_API_KEY secret)
    runs-on: ubuntu-latest
    needs: checks
    env:
      OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - name: Skip when no key is configured (forks, first-time contributors)
        id: key
        run: echo "present=${{ secrets.OPENROUTER_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Doctor
        if: steps.key.outputs.present == 'true'
        run: uv run python scripts/doctor.py
      - name: Run every notebook (assertions inside act as the eval gate)
        if: steps.key.outputs.present == 'true'
        run: |
          for nb in [0-9][0-9]_*.ipynb; do
            echo "::group::$nb"
            uv run jupyter nbconvert --to notebook --execute --output "/tmp/$nb" --ExecutePreprocessor.timeout=900 "$nb"
            echo "::endgroup::"
          done
      - name: Email job
        if: steps.key.outputs.present == 'true'
        run: uv run python jobs/email_triage.py --limit 10
